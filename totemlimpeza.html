<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Limpeza do banheiro</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background: #f4f6f9; }
  .contador { font-size: 3rem; font-weight: 700; line-height: 1; }
</style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <span class="navbar-brand mb-0 h1">Limpeza do banheiro</span>
    <span id="status" class="badge text-bg-secondary fs-6">Conectando...</span>
  </div>
</nav>

<main class="container" style="max-width: 900px;">

  <div class="row g-4">

    <!-- HOJE -->
    <div class="col-md-6">
      <div class="card shadow-sm h-100">
        <div class="card-header fw-bold">Hoje</div>
        <div class="card-body">
          <div class="row text-center">
            <div class="col-6">
              <div class="contador text-success" id="dl">0</div>
              <div class="text-muted mt-1">Limpo</div>
            </div>
            <div class="col-6">
              <div class="contador text-danger" id="ds">0</div>
              <div class="text-muted mt-1">Sujo</div>
            </div>
          </div>
          <div class="progress mt-4" style="height: 22px;">
            <div id="dp" class="progress-bar bg-success" style="width: 0%">0%</div>
          </div>
          <div class="small text-muted mt-1 text-center">% de votos "limpo"</div>
        </div>
      </div>
    </div>

    <!-- SEMANA -->
    <div class="col-md-6">
      <div class="card shadow-sm h-100">
        <div class="card-header fw-bold">Semana</div>
        <div class="card-body">
          <div class="row text-center">
            <div class="col-6">
              <div class="contador text-success" id="sl">0</div>
              <div class="text-muted mt-1">Limpo</div>
            </div>
            <div class="col-6">
              <div class="contador text-danger" id="ss">0</div>
              <div class="text-muted mt-1">Sujo</div>
            </div>
          </div>
          <div class="progress mt-4" style="height: 22px;">
            <div id="sp" class="progress-bar bg-success" style="width: 0%">0%</div>
          </div>
          <div class="small text-muted mt-1 text-center">% de votos "limpo"</div>
        </div>
      </div>
    </div>

  </div>

  <!-- ADMINISTRAÇÃO -->
  <div class="card shadow-sm mt-4 mb-5">
    <div class="card-header fw-bold">Administração</div>
    <div class="card-body">

      <div id="login" class="mb-3">
        <label for="senha" class="form-label">Senha de administrador</label>
        <div class="input-group">
          <input type="password" id="senha" class="form-control" placeholder="Digite a senha">
          <button class="btn btn-dark" onclick="desbloquear()">Liberar controles</button>
        </div>
      </div>

      <div class="d-flex flex-wrap gap-2">
        <button id="btnPausa" class="btn btn-warning" disabled onclick="alternarPausa()">Pausar</button>
        <button id="btnReset" class="btn btn-outline-danger" disabled onclick="reiniciar()">Reiniciar contagem</button>
      </div>

      <div id="msg" class="alert alert-secondary py-2 mt-3 mb-0 d-none"></div>
    </div>
  </div>

</main>

<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
const HOST = 'wss://xe121207.ala.us-east-1.emqxsl.com:8084/mqtt';
const TOPIC_CONT = 'totem/banheiro1/contagem';
const TOPIC_CMD = 'totem/banheiro1/comando';
const rand = () => Math.random().toString(16).slice(2);
const $ = id => document.getElementById(id);

let pausado = false;

function setStatus(texto, classe) {
  const el = $('status');
  el.textContent = texto;
  el.className = 'badge fs-6 ' + classe;
}

function atualizaBarra(id, limpo, sujo) {
  const total = limpo + sujo;
  const pct = total === 0 ? 0 : Math.round((limpo / total) * 100);
  const el = $(id);
  el.style.width = pct + '%';
  el.textContent = pct + '%';
}

// ---- Leitura (usuário só-leitura) ----
const leitor = mqtt.connect(HOST, {
  username: 'site_leitura',
  password: 'SENHA_DO_SITE',
  clientId: 'site-' + rand()
});

leitor.on('connect', () => leitor.subscribe(TOPIC_CONT));
leitor.on('error', (err) => {
  console.error("ERRO MQTT: " + err);
  setStatus('Erro: ' + err.message, 'text-bg-danger');
});
leitor.on('close', () => console.log("conexão fechada"))
leitor.on('offline', () => { console.log("offline"); setStatus('Desconectado', 'text-bg-secondary'); })
leitor.on('reconnect', () => console.log("tentando reconectar..."))
leitor.on('connect', () => console.log("conectado ao broker"))


leitor.on('message', (topic, msg) => {
  const d = JSON.parse(msg.toString());

  $('dl').textContent = d.dia.limpo;
  $('ds').textContent = d.dia.sujo;
  $('sl').textContent = d.semana.limpo;
  $('ss').textContent = d.semana.sujo;
  atualizaBarra('dp', d.dia.limpo, d.dia.sujo);
  atualizaBarra('sp', d.semana.limpo, d.semana.sujo);

  pausado = !!d.pausado;
  if (pausado) setStatus('⏸ Pausado', 'text-bg-warning');
  else setStatus('● Contando', 'text-bg-success');
  $('btnPausa').textContent = pausado ? '▶ Retomar' : '⏸ Pausar';
});

// ---- Administração (senha digitada na hora) ----
let admin = null;

function desbloquear() {
  const senha = $('senha').value;
  if (!senha) return;
  if (admin) admin.end(true);

  admin = mqtt.connect(HOST, {
    username: 'site_admin',
    password: senha,
    clientId: 'admin-' + rand(),
    reconnectPeriod: 0
  });

  admin.on('connect', () => {
    setControles(true);
    $('login').classList.add('d-none');
    mostra('Controles liberados.', 'success');
  });
  admin.on('error', () => mostra('Senha incorreta ou sem permissão.', 'danger'));
  admin.on('close', () => setControles(false));
}

function setControles(on) {
  $('btnPausa').disabled = !on;
  $('btnReset').disabled = !on;
}

function enviar(cmd) {
  if (!admin || !admin.connected) return mostra('Controles bloqueados.', 'danger');
  admin.publish(TOPIC_CMD, cmd, { qos: 1, retain: false });
  mostra('Comando enviado: ' + cmd, 'success');
}

function alternarPausa() { enviar(pausado ? 'retomar' : 'pausar'); }

function reiniciar() {
  if (confirm('Zerar todas as contagens (dia e semana)? Isso não pode ser desfeito.')) {
    enviar('reiniciar');
  }
}

function mostra(texto, tipo) {
  const el = $('msg');
  el.className = 'alert alert-' + tipo + ' py-2 mt-3 mb-0';
  el.textContent = texto;
}
</script>
</body>
</html>
